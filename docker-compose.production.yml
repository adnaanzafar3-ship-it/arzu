
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: padhaanewala
      POSTGRES_USER: padhaanewala
      POSTGRES_PASSWORD: CHANGE_ME
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U padhaanewala -d padhaanewala"], interval: 10s, timeout: 5s, retries: 5}

  redis:
    image: redis:8-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
    expose: ["8000"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.padhaanewala.in
    depends_on: [backend]
    expose: ["3000"]

volumes:
  pgdata:
